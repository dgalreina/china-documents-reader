<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Reader</title>
    <meta name="description" content="Lee libros de historia de China: visor de PDF, traducción al español, hitos y personajes." />
    <!-- El rojo Zhou del acento de la app (el verde Shang es el de china-history). Colorea la barra del navegador en el móvil. -->
    <meta name="theme-color" content="#8e1b1b" />
    <!-- Iconos (generados por scripts/generate-app-icons.mjs) y manifiesto, para "Añadir a pantalla de inicio" en el móvil. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Las mismas tipografías que china-history: Manrope (texto) y Noto Serif SC (acentos en chino). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
